spring.application.name=fraud-scoring-engine
spring.datasource.url=jdbc:postgresql://localhost:5432/trustengine
spring.datasource.username=trustadmin
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'